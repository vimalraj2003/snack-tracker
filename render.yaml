services:
  - type: web
    name: snack-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/products.db
    disk:
      name: snack-db
      mountPath: /var/data
      sizeGB: 1
