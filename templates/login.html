<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MajorRangas — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card border-0 shadow-sm" style="width:100%;max-width:400px">
    <div class="card-body p-5">

      <div class="text-center mb-4">
        <img src="/static/logo.png" alt="MajorRangas" height="50" class="mb-3"
             onerror="this.style.display='none'">
        <h4 class="fw-bold mb-0">MajorRangas</h4>
        <small class="text-muted fw-semibold text-uppercase" style="letter-spacing:2px;font-size:0.7rem">Karuk Muruk</small>
        <div class="text-muted small mt-1">Sign in to your account</div>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
      </div>
      {% endif %}

      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" required
                   placeholder="Enter username" autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" required
                   placeholder="Enter password">
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
